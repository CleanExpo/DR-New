name: Load Testing

on:
  # schedule + pull_request triggers removed on 2026-05-25 because
  # GitHub was creating empty-jobs failure runs on every main-branch
  # push event despite neither trigger matching push. Keep branch pushes
  # attached to a guard job so required checks do not fail with zero jobs;
  # keep actual k6 runs manual-only.
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      scenario:
        description: 'Test scenario'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - matching
          - auth
          - database
      duration:
        description: 'Test duration (e.g., 10m, 1h)'
        required: false
        default: '10m'



env:
  K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
  BASE_URL_STAGING: https://staging.disasterrecovery.com.au
  BASE_URL_PRODUCTION: https://disaster-recovery-seven.vercel.app

jobs:
  trigger-guard:
    name: Trigger Guard
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only load testing
        run: |
          echo "Guard job present so ruleset-triggered runs never fail with zero jobs."
          echo "Actual k6 load tests run only when their scenario conditions match."

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    if: github.event_name == 'pull_request' || github.event.schedule || (github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'smoke')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm  # RA-3004 2026-05-12
        uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager (pnpm@9.15.9) — single SSOT
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run smoke test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/smoke-test.json \
            scenarios/smoke.js
        continue-on-error: true

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('load-tests/reports/smoke-summary.json', 'utf8');
              const data = JSON.parse(summary);

              const comment = `## 🚀 Smoke Test Results

              | Metric | Value |
              |--------|-------|
              | Total Requests | ${data.metrics?.http_reqs?.values?.count || 'N/A'} |
              | Avg Response Time | ${(data.metrics?.http_req_duration?.values?.avg || 0).toFixed(2)}ms |
              | P95 Response Time | ${(data.metrics?.http_req_duration?.values?.['p(95)'] || 0).toFixed(2)}ms |
              | Error Rate | ${((data.metrics?.http_req_failed?.values?.rate || 0) * 100).toFixed(2)}% |

              <details>
              <summary>View detailed results</summary>

              \`\`\`json
              ${JSON.stringify(data.metrics, null, 2).slice(0, 3000)}
              \`\`\`
              </details>
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Could not read results file:', e.message);
            }

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'load'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run claim submission load test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/load-test.json \
            scenarios/claim-submission.js

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'stress'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run database stress test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/stress-test.json \
            stress/database-pooling.js

      - name: Upload stress test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  matching-test:
    name: Contractor Matching Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'matching'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run contractor matching test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/matching-test.json \
            scenarios/contractor-matching.js

      - name: Upload matching test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  auth-test:
    name: Authentication Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'auth'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run authentication test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/auth-test.json \
            scenarios/authentication.js

      - name: Upload auth test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [smoke-test, load-test, stress-test, matching-test, auth-test]
    if: always()
    # Secrets cannot be referenced in `if:` conditionals; map to a job-level
    # env var and gate the step on env instead.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Post to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Load Test Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Load Test Results*\n\n- Environment: ${{ github.event.inputs.environment || 'staging' }}\n- Scenario: ${{ github.event.inputs.scenario || 'smoke' }}\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
