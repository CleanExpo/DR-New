name: Deploy Preview

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy to Vercel Preview
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $PREVIEW_URL"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview-url }}';
            const body = [
              '## Preview Deployment',
              '',
              `**URL:** ${previewUrl}`,
              `**Commit:** \`${context.sha.substring(0, 7)}\``,
              `**Branch:** \`${context.payload.pull_request.head.ref}\``,
              '',
              '---',
              '*Deployed by Vercel via GitHub Actions*'
            ].join('\n');

            // Find existing preview comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  smoke-tests:
    name: Smoke Tests on Preview
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    needs: deploy-preview
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment to stabilise
        run: sleep 30

      - name: Run smoke tests against preview
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview-url }}"
          echo "Testing $PREVIEW_URL..."

          # Test homepage
          HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL" || echo "000")
          echo "Homepage: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Homepage returned $HTTP_CODE"
          fi

          # Test health endpoint
          HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL/api/health" || echo "000")
          echo "Health: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Health endpoint returned $HTTP_CODE"
          fi

          echo "Smoke tests complete"

  lighthouse-preview:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: github.event.pull_request.base.ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Wait for deployment
        run: sleep 30

      - name: Run Lighthouse CI
        run: lhci autorun --collect.url=${{ needs.deploy-preview.outputs.preview-url }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-preview-results
          path: .lighthouseci
          retention-days: 30
