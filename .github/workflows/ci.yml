name: CI - Lint, Test, Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm run --if-present lint
      - run: pnpm exec tsc --noEmit

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present test
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          NEXTAUTH_SECRET: ci-test-secret-32chars-minimum-ok
          NEXTAUTH_URL: http://localhost:3000

  build:
    name: Build Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          NEXTAUTH_SECRET: ci-test-secret-32chars-minimum-ok
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          DIRECT_URL: 'postgresql://test:test@localhost:5432/test'
          CSRF_SECRET: ci-csrf-secret-32chars-minimum-ok!!
          JWT_SECRET: ci-jwt-secret-32chars-minimum-ok!!
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: apps/web/.next
          retention-days: 3
          include-hidden-files: true

  smoke-tests:
    name: Smoke Tests (DR-213)
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: apps/web/.next
      - name: Start server and run smoke tests
        run: |
          pnpm exec next start &
          SERVER_PID=$!

          # Wait for server to be ready (up to 60s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i}x2s"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

          # Run smoke tests (stay in apps/web where jest is installed)
          SMOKE_TEST_URL=http://localhost:3000 pnpm exec jest --config jest.smoke.config.ts --verbose --forceExit

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ci-test-secret-32chars-minimum-ok
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
