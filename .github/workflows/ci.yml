name: CI - Lint, Test, Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm run lint
      - run: pnpm run type-check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          CSRF_SECRET: test-csrf-secret-for-ci-minimum-32-chars
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: apps/web/.next
          retention-days: 3
          include-hidden-files: true

  smoke-tests:
    name: Smoke Tests (DR-217)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: apps/web/.next
      - name: Start server and run smoke tests
        run: |
          REPO_ROOT=$(pwd)
          cd apps/web
          pnpm exec next start &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

          SMOKE_TEST_URL=http://localhost:3000 pnpm exec jest --config "$REPO_ROOT/jest.smoke.config.js" --verbose --forceExit

          kill $SERVER_PID 2>/dev/null || true
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke_test
          DIRECT_URL: postgresql://smoke:smoke@localhost:5432/smoke_test
          STRIPE_SECRET_KEY: sk_test_dummy_for_ci_smoke_tests
          CSRF_SECRET: test-csrf-secret-for-ci-minimum-32-chars
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
