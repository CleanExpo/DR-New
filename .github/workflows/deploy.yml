name: Deploy - Production

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://disaster-recovery-seven.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://disaster-recovery-seven.vercel.app
          NODE_ENV: production
          TWILIO_ACCOUNT_SID: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_AUTH_TOKEN: dummy_token_for_build
          TWILIO_PHONE_NUMBER: +61000000000
          DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --project-id=${{ secrets.VERCEL_PROJECT_ID }} --scope=${{ secrets.VERCEL_SCOPE }}
