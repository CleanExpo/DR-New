name: Deploy - Production

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: [ "CI - Lint, Test, Build" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy-staging:
    name: Deploy to Vercel Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: staging
      url: https://disaster-recovery-staging.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://disaster-recovery-staging.vercel.app
      - name: Deploy to Vercel Staging
        run: |
          npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}             --project-id=${{ secrets.VERCEL_PROJECT_ID }}             --scope=${{ secrets.VERCEL_SCOPE }}
        env:
          VERCEL_ENV: preview

  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy-staging
    environment:
      name: production
      url: https://disaster-recovery-seven.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://disaster-recovery-seven.vercel.app
      - name: Deploy to Vercel Production
        run: |
          npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}             --project-id=${{ secrets.VERCEL_PROJECT_ID }}             --scope=${{ secrets.VERCEL_SCOPE }}
        env:
          VERCEL_ENV: production

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        if: always()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Production Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment ${{ job.status }}*
Repository: ${{ github.repository }}
Branch: ${{ github.ref }}
Author: ${{ github.actor }}"
                  }
                }
              ]
            }
        continue-on-error: true
