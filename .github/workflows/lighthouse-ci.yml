name: Lighthouse CI Performance Monitoring

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  lighthouse:
    name: Run Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://disasterrecovery.com.au/
            https://disasterrecovery.com.au/services/water-damage-restoration
            https://disasterrecovery.com.au/emergency
            https://disasterrecovery.com.au/locations/hamilton
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Check performance budget
        run: |
          echo "Checking performance thresholds..."
          # Performance score must be >= 90
          # Accessibility score must be >= 95
          # Best Practices score must be >= 90
          # SEO score must be >= 95

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30

      - name: Create performance report
        run: |
          echo "# Lighthouse Performance Report" > performance-report.md
          echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> performance-report.md
          echo "" >> performance-report.md
          echo "## Target Metrics" >> performance-report.md
          echo "- Performance: >= 90/100" >> performance-report.md
          echo "- Accessibility: >= 95/100" >> performance-report.md
          echo "- Best Practices: >= 90/100" >> performance-report.md
          echo "- SEO: >= 95/100" >> performance-report.md
          echo "" >> performance-report.md
          echo "## Core Web Vitals" >> performance-report.md
          echo "- LCP: < 2.5s" >> performance-report.md
          echo "- FID: < 100ms" >> performance-report.md
          echo "- CLS: < 0.1" >> performance-report.md

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('performance-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Alert on performance regression
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Implement alerting logic for performance regressions
          echo "Checking for performance regressions..."
          # If performance < 90, send alert

  core-web-vitals:
    name: Monitor Core Web Vitals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Measure Core Web Vitals
        run: |
          echo "Measuring Core Web Vitals..."
          # LCP (Largest Contentful Paint): < 2.5s
          # FID (First Input Delay): < 100ms
          # CLS (Cumulative Layout Shift): < 0.1
          # INP (Interaction to Next Paint): < 200ms
          # TTFB (Time to First Byte): < 600ms

      - name: Create vitals report
        run: |
          echo "# Core Web Vitals Report" > vitals-report.md
          echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> vitals-report.md
          echo "" >> vitals-report.md
          echo "## Thresholds" >> vitals-report.md
          echo "- LCP: < 2.5s (Good), < 4.0s (Needs Improvement)" >> vitals-report.md
          echo "- FID: < 100ms (Good), < 300ms (Needs Improvement)" >> vitals-report.md
          echo "- CLS: < 0.1 (Good), < 0.25 (Needs Improvement)" >> vitals-report.md
          echo "- INP: < 200ms (Good), < 500ms (Needs Improvement)" >> vitals-report.md
          echo "- TTFB: < 600ms (Good), < 1800ms (Needs Improvement)" >> vitals-report.md

      - name: Upload vitals report
        uses: actions/upload-artifact@v4
        with:
          name: core-web-vitals-report
          path: vitals-report.md
          retention-days: 30
