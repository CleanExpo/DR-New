name: Health - Post-Deployment Checks

on:
  workflow_run:
    workflows: [ "Deploy Production" ]
    types: [ completed ]

  schedule:
    # Ping /api/health every 5 minutes
    - cron: '*/5 * * * *'

jobs:
  scheduled-ping:
    name: Scheduled Health Ping
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Ping /api/health
        id: ping
        run: |
          response=$(curl -s -w "\n%{http_code}" https://disaster-recovery-seven.vercel.app/api/health)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Health check failed with status $http_code"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        run: |
          echo "::error::ALERT — production health check failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  health-check:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for deployment
        run: sleep 30
      
      - name: Check API health
        run: |
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts"
            response=$(curl -s -w "
%{http_code}" https://disaster-recovery-seven.vercel.app/api/health)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            
            echo "HTTP Status: $http_code"
            echo "Response: $body"
            
            if [ "$http_code" = "200" ] || [ "$http_code" = "503" ]; then
              echo "API is responding"
              break
            fi
            
            attempt=$((attempt + 1))
            if [ $attempt -le $max_attempts ]; then
              sleep 10
            fi
          done
          
          if [ "$http_code" != "200" ] && [ "$http_code" != "503" ]; then
            echo "Health check failed"
            exit 1
          fi

      - name: Check database connectivity
        run: |
          curl -s https://disaster-recovery-seven.vercel.app/api/health | grep -q '"database"'
          if [ $? -eq 0 ]; then
            echo "Database connectivity verified"
          else
            echo "Warning: Could not verify database"
            exit 1
          fi

      - name: Check metrics endpoint
        run: |
          curl -s https://disaster-recovery-seven.vercel.app/api/metrics | head -20
          if [ $? -eq 0 ]; then
            echo "Metrics endpoint is responding"
          else
            echo "Metrics endpoint failed"
            exit 1
          fi

      - name: Performance baseline check
        run: |
          response_time=$(curl -s -w '%{time_total}' -o /dev/null https://disaster-recovery-seven.vercel.app/api/health)
          echo "API response time: $response_time seconds"
          
          if (( $(echo "$response_time > 5" | bc -l) )); then
            echo "Warning: Response time is slow"
          fi

      - name: Notify on success
        if: success()
        run: echo "Health check passed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Health check failed - deployment may have issues"
          exit 1
