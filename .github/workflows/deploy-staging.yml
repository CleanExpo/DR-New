name: Deploy Staging

on:
  # Gated to workflow_dispatch only on 2026-05-25 because GitHub was
  # creating empty-jobs failure runs on every main-branch push despite
  # `push.branches=[develop]` filter. Until that anomaly is understood,
  # keep branch pushes attached to a guard job and keep actual staging
  # deployment callable manually.
  push:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  trigger-guard:
    name: Trigger Guard
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only staging deployment
        run: |
          echo "Guard job present so ruleset-triggered runs never fail with zero jobs."
          echo "Actual staging deployment runs only when deployment secrets and job conditions match."

  # Secrets cannot be referenced in job-level `if:` conditionals, so we read
  # the token inside a step (where the secrets context is available) and expose
  # a boolean output that downstream jobs gate on via `needs`.
  check-secrets:
    name: Check Deploy Secrets
    runs-on: ubuntu-latest
    outputs:
      has_vercel: ${{ steps.check.outputs.has_vercel }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vercel=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-staging:
    name: Deploy to Vercel Staging
    runs-on: ubuntu-latest
    # Skip entirely when Vercel secrets are not configured in this repo
    needs: check-secrets
    if: needs.check-secrets.outputs.has_vercel == 'true'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.staging-url }}
    outputs:
      staging-url: ${{ steps.deploy.outputs.staging-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm  # RA-3004 2026-05-12
        uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager (pnpm@9.15.9) — single SSOT
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview (Staging)
        id: deploy
        run: |
          STAGING_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "staging-url=$STAGING_URL" >> $GITHUB_OUTPUT
          echo "Deployed staging to: $STAGING_URL"

      - name: Create deployment summary
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.staging-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** develop" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: [check-secrets, deploy-staging]
    if: needs.check-secrets.outputs.has_vercel == 'true'
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ needs.deploy-staging.outputs.staging-url }}"
          echo "Testing $STAGING_URL..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Homepage test failed with code: $HTTP_CODE"
            exit 1
          fi
          echo "Homepage: $HTTP_CODE"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health")
          echo "Health endpoint: $HTTP_CODE"

          echo "Staging smoke tests passed!"
