  <defs>
    <pattern id="diagonal-stripes" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#e5e7eb" stroke-width="1" stroke-opacity="0.3"/>
      <line x1="-2.5" y1="7.5" x2="2.5" y2="12.5" stroke="#e5e7eb" stroke-width="1" stroke-opacity="0.3"/>
