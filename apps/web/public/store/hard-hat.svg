<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>NRPG Safety Hard Hat</title>
  <defs>
    <linearGradient id="hh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="hh-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA9B06"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#hh-bg)"/>
  <rect x="0" y="0" width="400" height="400" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Hard hat shell - profile/3-quarter view -->
  <path d="M70 230 Q70 120 200 100 Q330 120 330 230 L325 240 L75 240 Z" fill="url(#hh-shell)" stroke="#B8960A" stroke-width="1.5"/>
  <!-- Brim -->
  <path d="M55 238 Q55 225 70 228 L330 228 Q345 225 345 238 Q345 255 330 258 Q270 268 200 270 Q130 268 70 258 Q55 255 55 238 Z" fill="#D9A806" stroke="#B8960A" stroke-width="1.5"/>
  <!-- Brim underside shadow -->
  <path d="M75 240 Q130 262 200 264 Q270 262 325 240" fill="#B8960A" opacity="0.3"/>
  <!-- Shell surface highlight -->
  <path d="M120 140 Q200 125 280 140" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.4"/>
  <!-- Ridge line on top -->
  <path d="M200 100 L200 230" stroke="#B8960A" stroke-width="1" opacity="0.15"/>
  <!-- Ventilation slots -->
  <rect x="155" y="125" width="20" height="3" fill="#B8960A" opacity="0.4" rx="1"/>
  <rect x="225" y="125" width="20" height="3" fill="#B8960A" opacity="0.4" rx="1"/>
  <!-- Suspension band visible inside -->
  <path d="M100 235 Q130 205 200 198 Q270 205 300 235" fill="none" stroke="#6B7280" stroke-width="2"/>
  <!-- Suspension attachment points -->
  <circle cx="105" cy="233" r="3" fill="#9CA3AF" stroke="#6B7280" stroke-width="0.5"/>
  <circle cx="295" cy="233" r="3" fill="#9CA3AF" stroke="#6B7280" stroke-width="0.5"/>
  <!-- Ratchet knob at back -->
  <circle cx="310" cy="225" r="8" fill="#9CA3AF" stroke="#6B7280" stroke-width="1"/>
  <circle cx="310" cy="225" r="4" fill="#6B7280"/>
  <!-- NRPG decal sticker on front -->
  <g transform="translate(200, 178)">
    <!-- Decal background -->
    <rect x="-35" y="-18" width="70" height="36" fill="#0A0F1A" opacity="0.85" rx="2"/>
    <!-- Shield -->
    <path d="M0 -12 L12 -7 L12 5 L0 14 L-12 5 L-12 -7 Z" fill="#0d9488" stroke="#0B7C72" stroke-width="1"/>
    <text x="0" y="4" font-family="sans-serif" font-weight="bold" font-size="8" fill="#FFFFFF" text-anchor="middle">NRPG</text>
  </g>
  <!-- Surface reflection / sheen -->
  <ellipse cx="160" cy="160" rx="30" ry="20" fill="#FFFFFF" opacity="0.08" transform="rotate(-10, 160, 160)"/>
  <!-- Chin strap hanging -->
  <path d="M100 245 Q95 280 100 310 Q102 320 108 320" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <rect x="105" y="312" width="18" height="10" fill="#4B5563" stroke="#374151" stroke-width="0.5" rx="2"/>
</svg>