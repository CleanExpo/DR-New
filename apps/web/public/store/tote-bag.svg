<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>NRPG Canvas Tote Bag</title>
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="tb-bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#tb-bg)"/>
  <rect x="0" y="0" width="400" height="400" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Handles -->
  <path d="M140 130 Q140 70 170 65 Q175 63 175 70 L175 130" fill="none" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
  <path d="M260 130 Q260 70 230 65 Q225 63 225 70 L225 130" fill="none" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
  <!-- Handle inner highlight -->
  <path d="M140 130 Q140 72 170 67" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M260 130 Q260 72 230 67" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <!-- Bag body -->
  <path d="M90 130 L85 340 Q85 350 95 350 L305 350 Q315 350 315 340 L310 130 Z" fill="url(#tb-bag)" stroke="#0A0F1A" stroke-width="1.5"/>
  <!-- Top fold/opening -->
  <path d="M90 130 Q200 140 310 130" fill="none" stroke="#0A0F1A" stroke-width="1" opacity="0.5"/>
  <path d="M90 125 L310 125 L310 135 Q200 145 90 135 Z" fill="#1F2937" stroke="#0A0F1A" stroke-width="1"/>
  <!-- Canvas texture subtle lines -->
  <line x1="120" y1="130" x2="118" y2="350" stroke="#0A0F1A" stroke-width="0.3" opacity="0.2"/>
  <line x1="160" y1="130" x2="158" y2="350" stroke="#0A0F1A" stroke-width="0.3" opacity="0.2"/>
  <line x1="200" y1="135" x2="200" y2="350" stroke="#0A0F1A" stroke-width="0.3" opacity="0.2"/>
  <line x1="240" y1="130" x2="242" y2="350" stroke="#0A0F1A" stroke-width="0.3" opacity="0.2"/>
  <line x1="280" y1="130" x2="282" y2="350" stroke="#0A0F1A" stroke-width="0.3" opacity="0.2"/>
  <!-- NRPG Shield Logo -->
  <g transform="translate(200, 220)">
    <!-- Shield outline -->
    <path d="M0 -50 L40 -35 L42 10 L0 50 L-42 10 L-40 -35 Z" fill="none" stroke="#0d9488" stroke-width="2.5"/>
    <!-- Inner shield -->
    <path d="M0 -38 L30 -26 L32 6 L0 38 L-32 6 L-30 -26 Z" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
    <!-- NRPG text -->
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="22" fill="#0d9488" text-anchor="middle" letter-spacing="2">NRPG</text>
    <!-- Subtitle -->
    <text x="0" y="22" font-family="sans-serif" font-size="7" fill="#0d9488" text-anchor="middle" letter-spacing="3" opacity="0.7">DISASTER RECOVERY</text>
  </g>
  <!-- Bottom seam -->
  <path d="M92 340 L308 340" stroke="#0A0F1A" stroke-width="1" opacity="0.5"/>
  <!-- Side gusset hints -->
  <line x1="90" y1="130" x2="85" y2="340" stroke="#0A0F1A" stroke-width="0.5" opacity="0.3"/>
  <line x1="310" y1="130" x2="315" y2="340" stroke="#0A0F1A" stroke-width="0.5" opacity="0.3"/>
</svg>