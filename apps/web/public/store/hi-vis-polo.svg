<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>NRPG Hi-Vis Polo Shirt</title>
  <defs>
    <linearGradient id="hvp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="hvp-fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#hvp-bg)"/>
  <rect x="0" y="0" width="400" height="400" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Polo shirt body -->
  <path d="M130 150 L120 135 L80 155 L95 185 L110 175 L110 310 L290 310 L290 175 L305 185 L320 155 L280 135 L270 150" fill="url(#hvp-fabric)" stroke="#E8940A" stroke-width="1.5"/>
  <!-- Sleeves -->
  <path d="M110 175 L80 195 L95 185" fill="url(#hvp-fabric)" stroke="#E8940A" stroke-width="1"/>
  <path d="M290 175 L320 195 L305 185" fill="url(#hvp-fabric)" stroke="#E8940A" stroke-width="1"/>
  <!-- Left sleeve -->
  <path d="M110 175 L65 210 L80 240 L120 205 L110 195" fill="url(#hvp-fabric)" stroke="#E8940A" stroke-width="1.5"/>
  <!-- Right sleeve -->
  <path d="M290 175 L335 210 L320 240 L280 205 L290 195" fill="url(#hvp-fabric)" stroke="#E8940A" stroke-width="1.5"/>
  <!-- Collar -->
  <path d="M155 140 L170 125 L200 138 L230 125 L245 140 L230 155 L200 148 L170 155 Z" fill="#F0A030" stroke="#E8940A" stroke-width="1.5"/>
  <!-- Collar fold lines -->
  <line x1="170" y1="130" x2="185" y2="145" stroke="#E8940A" stroke-width="0.8" opacity="0.6"/>
  <line x1="230" y1="130" x2="215" y2="145" stroke="#E8940A" stroke-width="0.8" opacity="0.6"/>
  <!-- Button placket -->
  <line x1="200" y1="148" x2="200" y2="220" stroke="#E8940A" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="160" r="2.5" fill="#E8940A" opacity="0.7"/>
  <circle cx="200" cy="178" r="2.5" fill="#E8940A" opacity="0.7"/>
  <circle cx="200" cy="196" r="2.5" fill="#E8940A" opacity="0.7"/>
  <!-- Reflective stripe -->
  <rect x="110" y="240" width="180" height="6" fill="#FFFFFF" opacity="0.85" rx="1"/>
  <rect x="110" y="240" width="180" height="6" fill="none" stroke="#CCCCCC" stroke-width="0.5" rx="1"/>
  <!-- Second reflective stripe -->
  <rect x="110" y="260" width="180" height="4" fill="#FFFFFF" opacity="0.6" rx="1"/>
  <!-- NRPG text on chest -->
  <text x="165" y="210" font-family="sans-serif" font-weight="bold" font-size="18" fill="#0d9488" letter-spacing="2">NRPG</text>
  <!-- Subtle fabric texture lines -->
  <line x1="140" y1="180" x2="140" y2="310" stroke="#E8940A" stroke-width="0.3" opacity="0.2"/>
  <line x1="170" y1="165" x2="170" y2="310" stroke="#E8940A" stroke-width="0.3" opacity="0.2"/>
  <line x1="230" y1="165" x2="230" y2="310" stroke="#E8940A" stroke-width="0.3" opacity="0.2"/>
  <line x1="260" y1="180" x2="260" y2="310" stroke="#E8940A" stroke-width="0.3" opacity="0.2"/>
  <!-- Bottom hem -->
  <line x1="110" y1="310" x2="290" y2="310" stroke="#E8940A" stroke-width="2"/>
</svg>