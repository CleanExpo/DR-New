<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>NRPG Hi-Vis Safety Vest</title>
  <defs>
    <linearGradient id="sv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="sv-vest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC933"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sv-bg)"/>
  <rect x="0" y="0" width="400" height="400" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Vest body - back view showing text -->
  <!-- Left panel -->
  <path d="M115 120 L100 110 L85 140 L95 150 L100 145 L105 320 L190 320 L190 145" fill="url(#sv-vest)" stroke="#D9A000" stroke-width="1.5"/>
  <!-- Right panel -->
  <path d="M285 120 L300 110 L315 140 L305 150 L300 145 L295 320 L210 320 L210 145" fill="url(#sv-vest)" stroke="#D9A000" stroke-width="1.5"/>
  <!-- Center opening -->
  <rect x="190" y="145" width="20" height="175" fill="#050505" opacity="0.8"/>
  <!-- Neck opening -->
  <path d="M155 115 L175 100 L200 110 L225 100 L245 115" fill="none" stroke="#D9A000" stroke-width="1.5"/>
  <!-- Shoulder straps -->
  <path d="M115 120 L155 115 L175 100" fill="url(#sv-vest)" stroke="#D9A000" stroke-width="1.5"/>
  <path d="M285 120 L245 115 L225 100" fill="url(#sv-vest)" stroke="#D9A000" stroke-width="1.5"/>
  <!-- Reflective stripe - upper horizontal -->
  <path d="M105 210 L190 210 M210 210 L295 210" stroke="#E8E8E8" stroke-width="8" opacity="0.9"/>
  <path d="M105 210 L190 210 M210 210 L295 210" stroke="#CCCCCC" stroke-width="8" opacity="0.15"/>
  <!-- Reflective stripe - lower horizontal -->
  <path d="M105 260 L190 260 M210 260 L295 260" stroke="#E8E8E8" stroke-width="8" opacity="0.9"/>
  <path d="M105 260 L190 260 M210 260 L295 260" stroke="#CCCCCC" stroke-width="8" opacity="0.15"/>
  <!-- Reflective stripe outlines -->
  <path d="M105 206 L190 206 M210 206 L295 206" stroke="#BBBBBB" stroke-width="0.5"/>
  <path d="M105 214 L190 214 M210 214 L295 214" stroke="#BBBBBB" stroke-width="0.5"/>
  <path d="M105 256 L190 256 M210 256 L295 256" stroke="#BBBBBB" stroke-width="0.5"/>
  <path d="M105 264 L190 264 M210 264 L295 264" stroke="#BBBBBB" stroke-width="0.5"/>
  <!-- Vertical reflective stripes on shoulders -->
  <rect x="140" y="120" width="6" height="86" fill="#E8E8E8" opacity="0.85"/>
  <rect x="254" y="120" width="6" height="86" fill="#E8E8E8" opacity="0.85"/>
  <!-- DISASTER RECOVERY text across back -->
  <text x="200" y="180" font-family="sans-serif" font-weight="bold" font-size="13" fill="#050505" text-anchor="middle" letter-spacing="1.5">DISASTER RECOVERY</text>
  <!-- NRPG below -->
  <text x="200" y="240" font-family="sans-serif" font-weight="bold" font-size="20" fill="#050505" text-anchor="middle" letter-spacing="3">NRPG</text>
  <!-- Zipper/closure detail -->
  <line x1="200" y1="145" x2="200" y2="320" stroke="#444444" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Bottom hem -->
  <line x1="105" y1="320" x2="190" y2="320" stroke="#D9A000" stroke-width="2"/>
  <line x1="210" y1="320" x2="295" y2="320" stroke="#D9A000" stroke-width="2"/>
</svg>